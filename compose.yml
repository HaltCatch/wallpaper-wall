services:
  wallpaper-wall:
    build:
      context: .
    image: wallpaper-wall:local
    ports:
      - "${WALLPAPER_PORT:-4000}:8080"
    environment:
      WALLPAPER_PUBLIC_ORIGIN: ${WALLPAPER_PUBLIC_ORIGIN:-https://service.example.com}
      WALLPAPER_PUBLIC_IMAGE_BASE_URL: ${WALLPAPER_PUBLIC_IMAGE_BASE_URL:-}
      WALLPAPER_HOMEPAGE_SYNC_URL: ${WALLPAPER_HOMEPAGE_SYNC_URL:-}
      WALLPAPER_HOMEPAGE_SYNC_SECRET: ${WALLPAPER_HOMEPAGE_SYNC_SECRET:-}
      WALLPAPER_AGENT_SCHEME: ${WALLPAPER_AGENT_SCHEME:-wallpaperwall}
      WALLPAPER_DOWNLOADS_BASE_URL: ${WALLPAPER_DOWNLOADS_BASE_URL:-/public/downloads}
      WALLPAPER_PUBLIC_DIR: /app/runtime
      WALLPAPER_DATA_DIR: /app/data
      WALLPAPER_AUTH_MODE: ${WALLPAPER_AUTH_MODE:-local}
      WALLPAPER_SESSION_SECRET: ${WALLPAPER_SESSION_SECRET:-}
      WALLPAPER_LOCAL_REGISTRATION: ${WALLPAPER_LOCAL_REGISTRATION:-true}
      WALLPAPER_AUTH_RATE_LIMIT_ATTEMPTS: ${WALLPAPER_AUTH_RATE_LIMIT_ATTEMPTS:-10}
      WALLPAPER_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${WALLPAPER_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      WALLPAPER_ADMIN_LOCAL_USERS: ${WALLPAPER_ADMIN_LOCAL_USERS:-}
      WALLPAPER_OIDC_ISSUER: ${WALLPAPER_OIDC_ISSUER:-}
      WALLPAPER_OIDC_CLIENT_ID: ${WALLPAPER_OIDC_CLIENT_ID:-}
      WALLPAPER_OIDC_CLIENT_SECRET: ${WALLPAPER_OIDC_CLIENT_SECRET:-}
      WALLPAPER_OIDC_REDIRECT_URI: ${WALLPAPER_OIDC_REDIRECT_URI:-}
      WALLPAPER_ADMIN_SUBJECTS: ${WALLPAPER_ADMIN_SUBJECTS:-}
      WALLPAPER_STORAGE_DRIVER: ${WALLPAPER_STORAGE_DRIVER:-local}
      WALLPAPER_S3_ENDPOINT: ${WALLPAPER_S3_ENDPOINT:-}
      WALLPAPER_S3_BUCKET: ${WALLPAPER_S3_BUCKET:-}
      WALLPAPER_S3_REGION: ${WALLPAPER_S3_REGION:-us-east-1}
      WALLPAPER_S3_ACCESS_KEY: ${WALLPAPER_S3_ACCESS_KEY:-}
      WALLPAPER_S3_SECRET_KEY: ${WALLPAPER_S3_SECRET_KEY:-}
      WALLPAPER_S3_FORCE_PATH_STYLE: ${WALLPAPER_S3_FORCE_PATH_STYLE:-true}
      WALLPAPER_UPLOAD_MAX_BYTES: ${WALLPAPER_UPLOAD_MAX_BYTES:-104857600}
      WALLPAPER_USER_STORAGE_QUOTA_BYTES: ${WALLPAPER_USER_STORAGE_QUOTA_BYTES:-2147483648}
      WALLPAPER_MEDIA_URL_TTL_SECONDS: ${WALLPAPER_MEDIA_URL_TTL_SECONDS:-300}
      WALLPAPER_COOKIE_SECURE: ${WALLPAPER_COOKIE_SECURE:-true}
    volumes:
      - ${WALLPAPER_IMAGES_DIR:-/mnt/data/docker/wallpaper_wall/images}:/app/images:ro
      - wallpaper-wall-cache:/app/runtime
      - wallpaper-wall-data:/app/data
    restart: unless-stopped

volumes:
  wallpaper-wall-cache:
  wallpaper-wall-data:
