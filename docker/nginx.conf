load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  # catalog.json grows with the library; compressing it keeps first paint fast.
  # Brotli is preferred, gzip is the fallback for older clients.
  gzip on;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types application/json application/javascript text/css;
  gzip_min_length 1024;
  brotli on;
  brotli_comp_level 5;
  brotli_types application/json application/javascript text/css;
  brotli_min_length 1024;

  # Keep the browser-facing scheme supplied by an upstream reverse proxy
  # (such as Nginx Proxy Manager).  Fall back to this nginx hop for direct
  # access where no forwarded scheme exists.
  map $http_x_forwarded_proto $wallpaper_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  server {
    listen 8080;
    server_name _;
    charset utf-8;
    # Match the default 100 MiB application limit with enough room for
    # multipart framing. The API still validates the exact byte count.
    client_max_body_size 101m; # WALLPAPER_UPLOAD_LIMIT

    # Explicit locations prevent the Docker image from exposing anything
    # beyond the built pages, hashed assets and the wallpaper data.
    # HTML is revalidated on every load; everything it references below is
    # content-hashed (bundled assets, thumbnails), so those can be immutable.
    location = / { root /app; try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location = /index.html { root /app; add_header Cache-Control "no-cache"; }
    location = /detail.html { root /app; add_header Cache-Control "no-cache"; }
    location = /favicon.ico { root /app; expires 7d; add_header Cache-Control "public"; }
    location = /favicon.svg { root /app; expires 7d; add_header Cache-Control "public"; }

    # Static wallpaper media is authorized per request by the API so the
    # administrator's mounted-folder visibility policy is enforced even for
    # direct URLs. Denials become 404 to avoid revealing hidden folders.
    location = /_authz_media {
      internal;
      proxy_pass http://127.0.0.1:8000/api/v1/authz/media;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
    location = /healthz {
      proxy_pass http://127.0.0.1:8000;
      # Preserve the externally visible port.  FastAPI uses this value for
      # same-origin checks on login and registration requests.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $wallpaper_forwarded_proto;
    }
    location ^~ /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $wallpaper_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Uploads are bounded and streamed by the API, so nginx must not create
      # a second full request body on its own filesystem.
      proxy_request_buffering off;
    }
    location ^~ /assets/ {
      alias /app/assets/;
      expires 365d;
      add_header Cache-Control "public, immutable";
      # Serve the .br/.gz files precompressed at build time; no CPU per request.
      brotli_static on;
      gzip_static on;
      open_file_cache max=2048 inactive=120s;
      open_file_cache_valid 300s;
    }
    location ^~ /public/thumbs/ {
      alias /app/public/thumbs/;
      auth_request /_authz_media;
      error_page 401 403 =404 /_hidden;
      expires 365d;
      add_header Cache-Control "public, immutable";
      open_file_cache max=4096 inactive=120s;
      open_file_cache_valid 300s;
    }
    # Homepage receives a dedicated, content-addressed WebP derivative rather
    # than the multi-megabyte source PNG.  It uses the same visibility policy
    # as thumbnails, and can therefore only be promoted from a public folder.
    location ^~ /public/homepage/ {
      alias /app/public/homepage/;
      auth_request /_authz_media;
      error_page 401 403 =404 /_hidden;
      expires 365d;
      add_header Cache-Control "public, immutable";
      open_file_cache max=2048 inactive=120s;
      open_file_cache_valid 300s;
    }
    location ^~ /public/downloads/ {
      alias /app/public/downloads/;
      expires 1d;
      add_header Cache-Control "public";
    }
    location ^~ /images/ {
      alias /app/images/;
      auth_request /_authz_media;
      error_page 401 403 =404 /_hidden;
      expires 1d;
      add_header Cache-Control "public";
      open_file_cache max=1024 inactive=60s;
      open_file_cache_valid 120s;
    }
    location = /_hidden { internal; return 404; }
    # The incremental-build cache is internal state (source paths and
    # fingerprints); it must not be downloadable.
    location = /public/.catalog-cache.json { return 404; }
    # The unfiltered catalogue would bypass the folder visibility policy;
    # browsers read it through GET /api/v1/catalog instead.
    location = /public/catalog.json { return 404; }
    location ^~ /public/ {
      alias /app/public/;
      add_header Cache-Control "no-store";
    }

    location / { return 404; }
  }
}
